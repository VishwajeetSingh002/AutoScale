services:
  - type: web
    name: autoscale-ecommerce
    env: node
    branch: main
    root: .
    buildCommand: npm install --prefix backend && npm install --prefix frontend && npm run build
    startCommand: npm start
    plan: standard
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=2048

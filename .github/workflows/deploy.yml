# GitHub Actions CI/CD Pipeline
name: CloudScale CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  terraform-audit:
    name: Terraform Validation & Security Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
      - name: Initialize Terraform Working Directory
        run: terraform init
        working-directory: ./terraform
      - name: Validate Terraform Syntax
        run: terraform validate
        working-directory: ./terraform

  build-and-pack:
    name: Build & Package Containers
    runs-on: ubuntu-latest
    needs: terraform-audit
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Frontend Dependencies
        run: npm install
        working-directory: ./frontend
      - name: Compile React Frontend (Production Build)
        run: npm run build
        working-directory: ./frontend
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Compile & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: 790776864418.dkr.ecr.us-east-1.amazonaws.com/cloudscale-backend:latest
      - name: Compile & Push Frontend Nginx Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          tags: 790776864418.dkr.ecr.us-east-1.amazonaws.com/cloudscale-frontend:latest